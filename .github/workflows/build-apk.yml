name: Compiler l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Installer Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Vérifier le SDK Android
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Installer les dépendances
        run: npm ci

      - name: Copier l'appli dans le projet Android
        run: npx cap sync android

      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Renommer l'APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/hashi-1.0.${{ github.run_number }}.apk"
          ls -la dist

      - name: Garder l'APK comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: hashi-apk
          path: dist/*.apk

      - name: Publier une version téléchargeable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Hashi 1.0.${{ github.run_number }}
          body: |
            Télécharge le fichier **hashi-1.0.${{ github.run_number }}.apk** ci-dessous depuis ton téléphone Android, puis ouvre-le pour l'installer.
            Les mises à jour s'installent par-dessus la version précédente, sans perdre tes données.
          files: dist/*.apk
          make_latest: true
